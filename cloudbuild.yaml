# ==============================================================================
# TALENTPULSE AI — GOOGLE CLOUD BUILD PIPELINE
# ==============================================================================
steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/talentpulse-ai:$COMMIT_SHA', '.']

  # 2. Push Container Image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/talentpulse-ai:$COMMIT_SHA']

  # 3. Deploy Container to Google Cloud Run (Preserves Cloud Run Env Vars)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'talentpulse-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/talentpulse-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/talentpulse-ai:$COMMIT_SHA'
